<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mapterhorn-japan-bridge Monitor</title>
    <link rel="stylesheet" href="https://unpkg.com/openmct@4.3.0-rc1/dist/espressoTheme.css" />
    <!-- MapLibre pinned to v5 (not v6, which dropped the plain-<script> UMD
         bundle) -- same pin sas0 uses, see its DECISIONS.md D2/D27. -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <script>
      // Open MCT's built-in search indexer starts a SharedWorker from the
      // script's own origin. Since Open MCT is loaded from a CDN here, that
      // worker load is cross-origin and browsers block it (confirmed by
      // sas0, DECISIONS.md D3). Disabling SharedWorker makes Open MCT fall
      // back to its synchronous in-page search implementation instead.
      window.SharedWorker = undefined;
    </script>
    <script src="https://unpkg.com/openmct@4.3.0-rc1/dist/openmct.js"></script>
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <div id="app"></div>
    <!-- ?v= cache-busts these on every dashboard code change (2026-09-05):
         a long-lived browser tab checking this dashboard over a multi-day
         mission otherwise keeps running whatever instrument JS it first
         loaded, silently missing later fixes until something else forces a
         hard reload. Bump the date whenever any file below this line
         changes. -->
    <script src="./core.js?v=20260905b"></script>
    <script src="./config.js?v=20260905b"></script>
    <script src="./instruments/current-stage.js?v=20260905b"></script>
    <script src="./instruments/status-map.js?v=20260905b"></script>
    <script src="./instruments/resources.js?v=20260905b"></script>
    <script src="./instruments/mission-timeline.js?v=20260905b"></script>
    <script src="./instruments/live-viewer.js?v=20260905b"></script>
    <script src="./instruments/progress-trend.js?v=20260905b"></script>
    <script src="./boot.js?v=20260905b"></script>
  </body>
</html>
